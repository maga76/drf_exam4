components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    page:
      name: page
      in: query
      schema: { type: integer }
    search:
      name: search
      in: query
      schema: { type: string }

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        username: { type: string }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string, enum: [admin, teacher, student, parent] }
    School:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string }
        address: { type: string }
        phone: { type: string }
    Building:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        school: { type: integer }
        name: { type: string }
    AcademicYear:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string, example: "2025/2026" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_current: { type: boolean }
    Subject:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string }
        code: { type: string }
    Room:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        building: { type: integer }
        number: { type: string }
        capacity: { type: integer }
        room_type: { type: string, enum: [classroom, lab, gym, music] }
    Grade:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        academic_year: { type: integer }
        number: { type: integer }
        letter: { type: string }
