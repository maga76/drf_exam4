openapi: 3.0.3
info:
  title: Smart School API
  description: API Smart School (расписание, оценки, посещаемость, уведомления)
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Local dev

tags:
  - name: Auth
  - name: Users
  - name: Schools
  - name: Buildings
  - name: AcademicYears
  - name: Subjects
  - name: Rooms
  - name: Grades
  - name: Teachers
  - name: Students
  - name: Parents
  - name: TimeSlots
  - name: Schedules
  - name: Lessons
  - name: SubjectHours
  - name: Replacements
  - name: Attendance
  - name: Marks
  - name: Homework
  - name: Announcements
  - name: Notifications
  - name: Dashboard

security:
  - bearerAuth: []

paths:
  /auth/login/:
    post:
      tags: [Auth]
      summary: Получить JWT токены
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Токены получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }
                  refresh: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh/:
    post:
      tags: [Auth]
      summary: Обновить access токен
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        '200':
          description: Новый access токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }

  /auth/logout/:
    post:
      tags: [Auth]
      summary: Выйти (blacklist refresh токена)
      responses:
        '204': { description: Выход выполнен }

  /auth/me/:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /users/:
    get:
      tags: [Users]
      summary: Список пользователей
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Users]
      summary: Создать пользователя
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '201': { description: Создан }

  /users/{id}/:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Users]
      summary: Получить пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Полное обновление
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200': { description: Обновлён }
    patch:
      tags: [Users]
      summary: Частичное обновление
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200': { description: Обновлён }
    delete:
      tags: [Users]
      summary: Удалить пользователя
      responses:
        '204': { description: Удалён }

